apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: vault

  source:
    # YOUR GitOps repo
    repoURL: https://github.com/hashicorp/vault-helm.git
    targetRevision: main
    path: vault

    # Use the official Vault Helm chart with your values.yaml
    helm:
      releaseName: vault
      chart: vault
      repoURL: https://helm.releases.hashicorp.com
      valueFiles:
        - values.yaml

  syncPolicy:
    automated:
      prune: true      # delete stuff removed from Git
      selfHeal: true   # fix drift automatically
    syncOptions:
      - CreateNamespace=true
