apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: vault

  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    # Use a specific chart version from the releases page for reproducibility
    targetRevision: 0.31.0
    helm:
      releaseName: vault
      values: |
        global:
          enabled: true

        server:
          # Run Vault in HA mode with Raft storage for a realistic lab
          ha:
            enabled: true
            replicas: 3
            raft:
              enabled: true
              setNodeId: true

          dataStorage:
            enabled: true
            size: 5Gi
            # For your lab you can leave storageClass empty to use default
            # storageClass: standard

          # Expose Vault internally; we’ll worry about external access separately
          service:
            type: ClusterIP
            port: 8200

        ui:
          enabled: true

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
